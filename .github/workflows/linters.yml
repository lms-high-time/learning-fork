name: Linters

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ high-time ]
  # Weekly full pass for the secrets and dependencies job: a CVE lands in a
  # lockfile nobody touched. The other jobs stay PR-only.
  schedule:
    - cron: "53 6 * * 1"

# Read-only by default (OpenSSF Scorecard Token-Permissions); a job that
# writes asks for it itself.
permissions:
  contents: read

jobs:
  commit-lint:
    name: 'Semantic Commits'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 200
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          check-latest: true

      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  linters:
    name: Semgrep Rules
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and Run Pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Download semgrep
        run: pip install semgrep

      - name: Run Semgrep rules
        run: semgrep ci --config ./frappe-semgrep-rules/rules

      - name: Run LMS security Semgrep rules
        # `semgrep ci` is diff-aware on its own: in a PR it fetches and computes
        # the branch-off point itself, so only findings this PR introduces
        # block. Passing --baseline-commit instead would fail here, because the
        # checkout above is shallow and `git cat-file -e <base sha>` misses.
        # The fixtures are deliberate positives and must not be scanned.
        run: semgrep ci --config ./.github/semgrep/security.yml --exclude '.github/semgrep/fixtures'

      - name: Run Vue directive Semgrep rules
        # --error for the same reason as the RTL step below: a bare
        # `semgrep scan` prints its findings and still exits 0. The tree is at
        # 0 findings, so no baseline is needed.
        run: semgrep scan --error --config ./.github/semgrep/vue-directives.yml frontend/src

      - name: Run RTL Semgrep rules
        # --error is required: a bare `semgrep scan` prints its findings and
        # still exits 0, so without it this step could never fail.
        run: semgrep scan --error --config ./.github/semgrep/tailwind-rtl.yml

  # Secrets (gitleaks) and vulnerable JS dependencies (trivy on yarn.lock and
  # frontend/yarn.lock). Design and decisions:
  # lms-high-time/learning-services#629. Blocks on any secret and on any
  # HIGH/CRITICAL vulnerability that has a fix; a scanner that fails is red,
  # not "clean". MEDIUM with a fix in what ships is a warning and a summary
  # table, never red (learning-services#668).
  #
  # What it does NOT do: Python dependencies (no lockfile here — the stand
  # image is scanned by trivy in learning-services); upstream code issues
  # (that is the Semgrep Rules job, PR-only and diff-aware); dev
  # dependencies (trivy skips them — everything bundled is in
  # frontend/package.json `dependencies`); and it cannot stop a PR from
  # editing this workflow or .gitleaksignore — that only shows up as a
  # warning, review is the real guard.
  secrets-deps:
    name: Secrets and Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
      TRIVY_IMAGE: aquasec/trivy:0.57.1@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # PR: its own commits; push: the pushed commits (an unreachable
      # `before`, e.g. after a force push, means a full scan); schedule and
      # manual runs: every branch's full history.
      - name: Range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            # The checkout is the merge commit: its first parent is the base
            # tip, so HEAD^1..PR_HEAD is exactly the PR's commits, even if the
            # base branch was force-pushed and PR_BASE is gone.
            pull_request)
              echo "log=HEAD^1..$PR_HEAD" >> "$GITHUB_OUTPUT"
              changed=$(git diff --name-only HEAD^1 HEAD | grep -E '^(\.github/workflows/linters\.yml|\.gitleaksignore|\.gitleaks\.toml)$' | paste -sd, - || true)
              [ -z "$changed" ] || echo "::warning::this PR changes the gate itself: $changed — check it in review" ;;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                echo "log=$BEFORE..$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              else
                echo "log=--all" >> "$GITHUB_OUTPUT"
              fi ;;
            *) echo "log=--all" >> "$GITHUB_OUTPUT" ;;
          esac

      # Our own gitleaks config: an explicit --config wins over a
      # .gitleaks.toml in the tree, so a PR cannot allowlist itself away;
      # .gitleaksignore still applies. The exit code is kept, not trusted
      # alone: gitleaks writes `[]` and exits 1 on a git error.
      - name: Secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log }}
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          rc=0
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/out" "$GITLEAKS_IMAGE" \
            git /repo --redact --no-banner --config /out/gitleaks.toml --log-opts="$LOG_OPTS" \
            --exit-code 0 -f json -r /out/gitleaks.json || rc=$?
          [ "$rc" = 0 ] || { echo "::error::gitleaks failed (exit $rc) — see the log above"; exit 1; }
          leaks=$(jq length "$RUNNER_TEMP/gitleaks.json") || { echo "::error::gitleaks report unreadable"; exit 1; }
          jq -r '.[] | "::error::secret \(.RuleID) in \(.Commit[0:7]) \(.File | gsub("[\r\n%]"; "_")):\(.StartLine) — revoke it and drop it from history; a false positive goes to .gitleaksignore with a comment"' "$RUNNER_TEMP/gitleaks.json"
          [ "$leaks" = 0 ]

      # trivy exits 1 only when it finds a HIGH/CRITICAL vulnerability with a
      # fix; any other failure is non-zero too — both are red.
      - name: Dependencies
        run: |
          # No lockfile means nothing scanned — not "clean".
          for f in yarn.lock frontend/yarn.lock; do
            [ -f "$f" ] || { echo "::error::$f is missing — trivy would scan nothing"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs '**/node_modules' --exit-code 1 /repo

      # MEDIUM with a fix in what ships (trivy skips devDependencies, so this
      # is the bundle plus frappe-ui's tree): advisory only. A MEDIUM in a
      # sanitizer is still an XSS — dompurify sat at 17 of them unnoticed
      # (learning-services#668) — but some fixes exist only in a major the
      # upstream pins (echarts 6 via frappe-ui), so red here would be red for
      # weeks. Bump it, or say in the PR why not. Runs even when the gate above
      # is red; a scanner failure here is a warning, the gate decides.
      - name: Dependencies (MEDIUM, advisory)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/out" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" fs \
            --scanners vuln --severity MEDIUM --ignore-unfixed \
            --skip-dirs '**/node_modules' --exit-code 0 -f json -o /out/trivy-medium.json /repo || rc=$?
          [ "$rc" = 0 ] || { echo "::warning::trivy (MEDIUM) failed (exit $rc) — advisory only"; exit 0; }
          report="$RUNNER_TEMP/trivy-medium.json"
          n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$report") || { echo "::warning::trivy MEDIUM report unreadable"; exit 0; }
          if [ "$n" = 0 ]; then
            echo "No MEDIUM vulnerability with a fix in shipped dependencies." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### MEDIUM with a fix in shipped dependencies: $n"
            echo
            echo "Advisory, does not block. Bump it, or say in the PR why not."
            echo
            echo "| Lockfile | Package | Installed | Fixed in | ID |"
            echo "|---|---|---|---|---|"
            jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | "| \($t) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \(.VulnerabilityID) |"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          pkgs=$(jq -r '[.Results[]?.Vulnerabilities[]? | "\(.PkgName)@\(.InstalledVersion)"] | unique | join(", ")' "$report")
          echo "::warning::$n MEDIUM vulnerabilities with a fix in shipped dependencies: $pkgs — see the run summary"
