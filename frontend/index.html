<!DOCTYPE html>
<html lang="{{ boot.lang }}" dir="{{ boot.text_direction }}">
	<head>
		<meta charset="UTF-8" />
		<script>
			/* The document is painted from --surface-base, which only resolves to
			   the dark value once <html data-theme="dark"> exists. src/utils/theme.ts
			   sets that attribute, but it cannot run until the app bundle executes —
			   measured on a production build at 390px with the bundle blocked, the
			   stylesheet alone paints srgb(255,255,255), and the bundle lands about
			   300ms after first paint (1.1s at 6x CPU throttle). So a dark-mode user
			   gets a full-screen white flash on every cold load. Resolving the stored
			   preference here, before the stylesheet can paint, is the only place
			   early enough: the preference lives in localStorage, so the server
			   cannot render it into <html> the way frappe/www/desk.html does.
			   Keep these rules in step with src/utils/theme.ts —
			   src/tests/themeBootstrap.test.ts asserts the two agree. */
			try {
				var preference = localStorage.getItem('themePreference')
				if (
					preference !== 'light' &&
					preference !== 'dark' &&
					preference !== 'system'
				) {
					var legacy = localStorage.getItem('theme')
					preference =
						legacy === 'dark' || legacy === 'light' ? legacy : 'system'
				}
				document.documentElement.setAttribute(
					'data-theme',
					preference === 'system'
						? window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light'
						: preference
				)
			} catch (error) {
				/* Private-mode localStorage throws; the light default still applies. */
			}
		</script>
		<link rel="icon" href="{{ favicon }}" />
		<link rel="manifest" href="/api/method/lms.lms.api.get_pwa_manifest" />
		<!-- Analytics consent: the public site's shared script on the same domain, so the
		     choice is one for all of cenda.app (lms-high-time/learning-services#582). -->
		<script src="/site/analytics.js" defer></script>
		<link rel="apple-touch-icon" href="public/manifest/cenda-apple-touch-180.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="msapplication-navbutton-color" content="#ffffff" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<title>{{ title | e }}</title>
		<meta name="title" content="{{ meta.title | e }}" />
		<meta name="image" content="{{ meta.image | e }}" />
		<meta name="description" content="{{ meta.description | e }}" />
		<meta name="keywords" content="{{ meta.keywords | e }}" />
		<meta property="og:title" content="{{ meta.title | e }}" />
		<meta property="og:image" content="{{ meta.image | e }}" />
		<meta property="og:description" content="{{ meta.description | e }}" />
		<meta name="twitter:title" content="{{ meta.title | e }}" />
		<meta name="twitter:image" content="{{ meta.image | e }}" />
		<meta name="twitter:description" content="{{ meta.description | e }}" />
	</head>
	<body class="sm:overscroll-y-none no-scrollbar">
		<div id="app">
			<div id="seo-content">
				<h1>{{ meta.title | e }}</h1>
				<p>
					{{ meta.description | e }}
				</p>
				<a href="{{ meta.link | e }}">Know More</a>
			</div>
		</div>
		<script>
			document.getElementById('seo-content').style.display = 'none';
		</script>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
